name: InitHeadphone build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    env:
      SDK: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
    steps:
      - uses: actions/checkout@v4
      - name: MacKernelSDK
        run: |
          git clone -q https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK
          git -C MacKernelSDK checkout -q "$SDK"
      - name: Build InitHeadphone.kext
        shell: bash
        run: |
          exec > >(tee -a build.log) 2>&1
          set -euo pipefail
          mkdir -p obj dist/InitHeadphone.kext/Contents/MacOS
          cat > obj/kmod_info.c <<'KMOD'
          #include <mach/mach_types.h>
          #include <mach/kmod.h>

          static kern_return_t ih_start(kmod_info_t *ki, void *data) { (void)ki; (void)data; return KERN_SUCCESS; }
          static kern_return_t ih_stop(kmod_info_t *ki, void *data) { (void)ki; (void)data; return KERN_SUCCESS; }

          __attribute__((visibility("default"))) KMOD_EXPLICIT_DECL(local.InitHeadphone, "1.0.0", ih_start, ih_stop)
          KMOD
          SYSROOT="$(xcrun --show-sdk-path)"
          FLAGS=(-target x86_64-apple-macos10.13 -isysroot "$SYSROOT" -I MacKernelSDK/Headers
                 -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT
                 -fno-builtin -fno-common -mkernel -fno-stack-protector -O2 -Wall)
          xcrun clang -x c -std=gnu11 "${FLAGS[@]}" -c obj/kmod_info.c -o obj/kmod_info.o
          xcrun clang++ -x c++ -std=gnu++17 "${FLAGS[@]}" -fapple-kext -fno-rtti -fno-exceptions \
            -c InitHeadphone.cpp -o obj/InitHeadphone.o
          BIN=dist/InitHeadphone.kext/Contents/MacOS/InitHeadphone
          xcrun clang++ -target x86_64-apple-macos10.13 -isysroot "$SYSROOT" -nostdlib -fapple-kext \
            -Xlinker -kext obj/InitHeadphone.o obj/kmod_info.o -lcc_kext -o "$BIN"
          cp Info.plist dist/InitHeadphone.kext/Contents/Info.plist
          plutil -lint dist/InitHeadphone.kext/Contents/Info.plist
          FT=$(file "$BIN"); echo "$FT"
          [[ "$FT" == *"kext bundle"* && "$FT" == *x86_64* ]] || { echo "not an x86_64 kext"; exit 1; }
          DEF=$(nm -gU "$BIN"); [[ "$DEF" == *" _kmod_info"* ]] || { echo "_kmod_info missing"; exit 1; }
          LC=$(otool -l "$BIN"); [[ "$LC" != *LC_DYLD_CHAINED_FIXUPS* ]] || { echo "chained fixups found"; exit 1; }
          # the VoodooSMBus symbols used must be exactly these three, all exported by VoodooSMBus 3.0
          ALLOWED='__ZN20VoodooSMBusDeviceNub9metaClassE __ZN20VoodooSMBusDeviceNub12readByteDataEh __ZN20VoodooSMBusDeviceNub13writeByteDataEhh'
          USED=$(nm -u "$BIN" | grep VoodooSMBus || true)
          echo "VoodooSMBus symbols used:"; echo "$USED"
          for s in $USED; do
            case " $ALLOWED " in *" $s "*) ;; *) echo "unexpected symbol $s"; exit 1;; esac
          done
          [ "$(echo $USED | wc -w | tr -d ' ')" = 3 ] || { echo "expected 3 VoodooSMBus symbols"; exit 1; }
          echo "build OK"
      - uses: actions/upload-artifact@v4
        with:
          name: InitHeadphone
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
